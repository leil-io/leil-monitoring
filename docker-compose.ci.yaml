services:
  master:
    image: registry.leil.io/public/saunafs-master:${SAUNAFS_VERSION}-ubuntu-24.04
    container_name: saunafs-master
    ports:
      - "9421:9421"
    hostname: master
    volumes:
      - ./volumes/saunafs-master/etc/saunafs:/etc/saunafs
      - ./volumes/saunafs-master/var/lib/saunafs:/var/lib/saunafs
      - ./volumes/saunafs-master/var/log:/var/log
    networks:
      saunafsnet:
        aliases:
          - sfsmaster

  metalogger:
    image: registry.leil.io/public/saunafs-metalogger:${SAUNAFS_VERSION}-ubuntu-24.04
    container_name: saunafs-metalogger
    volumes:
      - ./volumes/saunafs-metalogger/etc/saunafs:/etc/saunafs
      - ./volumes/saunafs-metalogger/var/lib/saunafs:/var/lib/saunafs
      - ./volumes/saunafs-metalogger/var/log:/var/log
    depends_on:
      - master
    networks:
      - saunafsnet

  cgi:
    image: registry.leil.io/public/saunafs-cgiserver:${SAUNAFS_VERSION}-ubuntu-24.04
    container_name: saunafs-cgiserver
    ports:
      - "29425:9425"
    depends_on:
      - master
    networks:
      - saunafsnet

  chunkserver01:
    image: registry.leil.io/public/saunafs-chunkserver:${SAUNAFS_VERSION}-ubuntu-24.04
    container_name: saunafs-chunkserver01
    volumes:
      - ./volumes/saunafs-chunkserver01/etc/saunafs:/etc/saunafs
      - ./volumes/saunafs-chunkserver01/var/log:/var/log
      - ./volumes/saunafs-chunkserver01/var/lib/saunafs:/var/lib/saunafs
      - ./volumes/saunafs-chunkserver01/mnt/hdd001:/mnt/hdd001
      - ./volumes/saunafs-chunkserver01/mnt/hdd002:/mnt/hdd002
    ports:
      - "29431:9422"
    depends_on:
      - master
    networks:
      - saunafsnet

  client:
    image: registry.leil.io/public/saunafs-client:${SAUNAFS_VERSION}-ubuntu-24.04
    container_name: saunafs-client
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    command: ["/mnt/leil", "-H", "master", "-P", "9421", "-S", "/"]
    depends_on:
      - master
    volumes:
      - ./volumes/saunafs-client/var/log:/var/log
    networks:
      - saunafsnet

networks:
  saunafsnet:
    driver: bridge
