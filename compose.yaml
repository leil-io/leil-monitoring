name: LeilFS Monitoring
services:
    leil-monitoring:
        ports:
            - ${SAUNAFS_MONITORING_PORT:-8000}:${SAUNAFS_MONITORING_PORT:-8000}
        image: leil-monitoring:latest
        build: .
        environment:
            - SAUNAFS_MASTER_HOST=${SAUNAFS_MASTER_HOST:-sfsmaster}
            - SAUNAFS_MASTER_PORT=${SAUNAFS_MASTER_PORT:-9421}
            - SAUNAFS_MONITORING_HOST=${SAUNAFS_MONITORING_HOST:-0.0.0.0}
            - SAUNAFS_MONITORING_PORT=${SAUNAFS_MONITORING_PORT:-8000}
            - SAUNAFS_MONITORING_LOGLEVEL=${SAUNAFS_MONITORING_LOGLEVEL:-INFO}
    leil-api:
        ports:
            - ${SAUNAFS_API_PORT:-8001}:${SAUNAFS_API_PORT:-8001}
        image: leil-api:latest
        build:
            context: .
            dockerfile: Dockerfile.api
        environment:
            - SAUNAFS_MASTER_HOST=${SAUNAFS_MASTER_HOST:-sfsmaster}
            - SAUNAFS_MASTER_PORT=${SAUNAFS_MASTER_PORT:-9421}
            - SAUNAFS_API_HOST=${SAUNAFS_API_HOST:-0.0.0.0}
            - SAUNAFS_API_PORT=${SAUNAFS_API_PORT:-8001}
            - SAUNAFS_API_LOGLEVEL=${SAUNAFS_API_LOGLEVEL:-INFO}
    # leilfs-api: the canonical read-only LeilFS HTTP API (leilfs-api repo).
    # OPERATOR NOTE: leilfs-api lives in a separate repository (leilfs-api) and
    # has no published image yet. Replace the placeholder image below with either:
    #   image: <registry>/leilfs-api:<tag>
    # or a build context pointing at a local checkout, e.g.:
    #   build:
    #     context: ../leilfs-api
    #     dockerfile: Dockerfile
    # Until then, pull or build the image manually and tag it leilfs-api:latest.
    leilfs-api:
        ports:
            - ${LEILFS_API_PORT:-8080}:8080
        image: leilfs-api:latest  # placeholder — see OPERATOR NOTE above
        environment:
            - LEILFS_MASTER_ENDPOINTS=${SAUNAFS_MASTER_HOST:-sfsmaster}:${SAUNAFS_MASTER_PORT:-9421}
    # Go/Preact frontend. Serves the SPA and reverse-proxies /api/* to
    # leilfs-api (same origin, no CORS). Default host port 8003 -> 8000.
    leil-monitoring-go:
        ports:
            - ${SAUNAFS_MONITORING_GO_PORT:-8003}:8000
        image: leil-monitoring-go:latest
        build:
            context: ./go
            dockerfile: Dockerfile.web
        environment:
            - LEIL_API_URL=http://leilfs-api:8080
            - SAUNAFS_MONITORING_HOST=0.0.0.0
            - SAUNAFS_MONITORING_PORT=8000
        depends_on:
            - leilfs-api
