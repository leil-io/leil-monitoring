[autoflake]
remove-all-unused-imports = true

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
# packages = ["src/saunafs-monitoring"]

[project]
name = "saunafs-monitoring"
version = "1.0.0"
authors = [
  { name="SaunaFS team", email="support@saunafs.com" },
]
description = "Monitoring web application for SaunaFS"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT" # Placeholder, not actual license
license-files = ["LICEN[CS]E*"]


[project.urls]
Homepage = "https://leil.io"

[tool.setuptools.packages.find]
where = ["src"]
